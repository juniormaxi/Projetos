<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Tráfego Para Todos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Gestão de Tráfego Para Todos</h1>
        <nav>
            <ul>
                <li><a href="#servicos">Serviços</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <section class="slider" id="slider">
        <div class="slides">
            <div class="slide active" style="background-image: url('https://picsum.photos/id/1018/1200/400');"></div>
            <div class="slide" style="background-image: url('https://picsum.photos/id/1020/1200/400');"></div>
            <div class="slide" style="background-image: url('https://picsum.photos/id/1021/1200/400');"></div>
        </div>
        <button class="prev">&#10094;</button>
        <button class="next">&#10095;</button>
    </section>

    <section id="servicos">
        <h2>Nossos Serviços</h2>
        <p>Impulsione seu negócio com estratégias de tráfego pagas e orgânicas personalizadas.</p>
    </section>

    <section id="contato">
        <h2>Entre em Contato</h2>
        <p>Estamos prontos para gerenciar o tráfego do seu negócio.</p>
        <div class="social">
            <a href="https://facebook.com" target="_blank" aria-label="Facebook">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg" alt="Facebook">
            </a>
            <a href="https://instagram.com" target="_blank" aria-label="Instagram">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram">
            </a>
            <a href="https://www.linkedin.com" target="_blank" aria-label="LinkedIn">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/linkedin.svg" alt="LinkedIn">
            </a>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Gestão de Tráfego Para Todos</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
